services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    command: npm run dev -- --host

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clipshare
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
      - SPRING_REDIS_HOST=redis
      - STORAGE_MODE=local
      - STORAGE_LOCAL_PATH=/data/clips
      - UPLOAD_MAX_FILE_SIZE=300MB
      - MODERATION_CSAM_PROVIDER=mock
      - JWT_SECRET=change-me-in-dev
      - TURNSTILE_SECRET_KEY=change-me-in-dev
      - ANON_SESSION_COOKIE_SECRET=change-me-in-dev
    volumes:
      - ./backend:/app
      - clip-storage:/data/clips
      - maven-repo:/root/.m2
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - SPRING_PROFILES_ACTIVE=worker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clipshare
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
      - SPRING_REDIS_HOST=redis
      - STORAGE_MODE=local
      - STORAGE_LOCAL_PATH=/data/clips
      - MODERATION_CSAM_PROVIDER=mock
    volumes:
      - ./backend:/app
      - clip-storage:/data/clips
      - maven-repo:/root/.m2
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=clipshare
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  clip-storage:
  maven-repo:
