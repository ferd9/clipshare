services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Sobreescribible vía un .env sin trackear (ver .gitignore) — necesario para despliegues
      # donde el backend no vive en localhost (ej. túneles de Cloudflare para pruebas en la
      # nube, cada uno con su propia URL efímera que no tiene sentido commitear).
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    command: npm run dev -- --host
    # unless-stopped: si la VM se reinicia o el contenedor se cae solo, Docker lo levanta de
    # nuevo sin intervención manual (no reinicia si alguien lo paró a propósito con
    # "docker compose stop"). Ver scripts/start-tunnels.sh para el resto del arranque en frío.
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clipshare
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
      - SPRING_REDIS_HOST=redis
      - STORAGE_MODE=local
      - STORAGE_LOCAL_PATH=/data/clips
      - UPLOAD_MAX_FILE_SIZE=300MB
      - MODERATION_CSAM_PROVIDER=mock
      - JWT_SECRET=change-me-in-dev
      - APP_TURNSTILE_PROVIDER=mock
      - TURNSTILE_SECRET_KEY=change-me-in-dev
      - ANON_SESSION_COOKIE_SECRET=change-me-in-dev
      # Mismo criterio que VITE_API_BASE_URL de arriba — ver SecurityConfig.allowedOrigins.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Para armar el link dentro del email de verificación — ver ResendEmailService.
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:5173}
      # logging | resend — ver ResendEmailService/LoggingEmailService. Sin RESEND_API_KEY
      # configurada (.env sin trackear, nunca en este archivo) queda en "logging" por default.
      - APP_EMAIL_PROVIDER=${APP_EMAIL_PROVIDER:-logging}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM:-onboarding@resend.dev}
    volumes:
      - ./backend:/app
      - clip-storage:/data/clips
      - maven-repo:/root/.m2
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - SPRING_PROFILES_ACTIVE=worker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clipshare
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev
      - SPRING_REDIS_HOST=redis
      - STORAGE_MODE=local
      - STORAGE_LOCAL_PATH=/data/clips
      - MODERATION_CSAM_PROVIDER=mock
    volumes:
      - ./backend:/app
      - clip-storage:/data/clips
      - maven-repo:/root/.m2
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=clipshare
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
  clip-storage:
  maven-repo:
