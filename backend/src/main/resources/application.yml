spring:
  application:
    name: clipshare
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clipshare}
    username: ${SPRING_DATASOURCE_USERNAME:dev}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:300MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:300MB}

server:
  port: 8080
  tomcat:
    # Sin esto, Tomcat corta el POST en 2MB (default) mucho antes de llegar al límite de
    # arriba — es un límite del server, independiente del de Spring multipart.
    max-http-form-post-size: ${UPLOAD_MAX_FILE_SIZE:300MB}
    max-swallow-size: ${UPLOAD_MAX_FILE_SIZE:300MB}

# Config propia de la app (ver docs/SPEC.md secciones 6 y 13)
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-dev}
    access-token-ttl-minutes: 20   # corta duración a propósito, ver docs/SPEC.md sección 12
    refresh-token-ttl-days: 30
  auth:
    email-verification-ttl-hours: 24
    password-reset-ttl-hours: 1
  storage:
    mode: ${STORAGE_MODE:local}       # local | s3
    local-path: ${STORAGE_LOCAL_PATH:/data/clips}
  moderation:
    # mock | ncmec — mock siempre da "limpio" (sin lista real de hashes, ver docs/SPEC.md
    # secciones 2 y 10); ncmec queda como stub hasta cerrar el trámite de membresía ESP.
    csam-provider: ${MODERATION_CSAM_PROVIDER:mock}
  comments:
    rate-limit:
      guest-per-hour: ${COMMENT_RATE_LIMIT_GUEST_PER_HOUR:5}
      user-per-hour: ${COMMENT_RATE_LIMIT_USER_PER_HOUR:30}
  turnstile:
    # mock | cloudflare — mismo patrón que app.moderation.csam-provider: mock acepta
    # cualquier token no vacío (no hay cuenta real de Cloudflare en este entorno, ver
    # MockTurnstileClient); cloudflare hace la verificación real contra su API.
    provider: ${APP_TURNSTILE_PROVIDER:mock}
    secret-key: ${TURNSTILE_SECRET_KEY:change-me-in-dev}
  anon-session:
    cookie-secret: ${ANON_SESSION_COOKIE_SECRET:change-me-in-dev}

---
# Perfil "dev": API HTTP normal, corre en el contenedor `backend` (docker-compose.yml)
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.clipshare: DEBUG

---
# Perfil "worker": consumidor de cola (ffmpeg + PDQ hashing), corre en el contenedor `worker`.
# No expone la API HTTP (sin servidor embebido: no lo necesita, solo consume Redis).
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none

logging:
  level:
    com.clipshare.worker: DEBUG
