name: Deploy

# Se dispara con cada push a main — servidor de producción real en Hetzner (ver
# docs/DEPLOY.md). Antes apuntaba a develop/una VM de prueba en Google Cloud con el compose de
# desarrollo; ver git log de este archivo si hace falta recuperar ese flujo. Los secrets
# (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY) se configuran en GitHub: Settings → Secrets and
# variables → Actions, y deben apuntar al servidor de Hetzner, no a la VM vieja. La clave
# privada nunca vive en el repo. Los secrets de la app (JWT_SECRET, POSTGRES_PASSWORD, etc.) NO
# pasan por acá — viven solo en el ".env" del propio servidor (ver .env.prod.example), así este
# workflow no necesita conocerlos.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/clipshare
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
